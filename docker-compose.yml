services:
  anyconv:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: "http://localhost:3000"
      MAX_UPLOAD_MB: "200"
      FILE_TTL_MINUTES: "30"
      # Uncomment to enable pay-per-conversion:
      # STRIPE_SECRET_KEY: "sk_live_or_test_key"
      # STRIPE_WEBHOOK_SECRET: "whsec_..."
      # PRICE_AMOUNT: "99"
      # PRICE_CURRENCY: "usd"
    restart: unless-stopped
