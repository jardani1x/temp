name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, every push to the default branch
# deploys; you can also trigger a deploy from any branch via the Actions tab
# ("Run workflow") thanks to workflow_dispatch.
#
# The app uses `base: "./"` (see vite.config.ts), so it works from a project
# subpath like https://<user>.github.io/<repo>/ without any extra config.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of this workflow.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
